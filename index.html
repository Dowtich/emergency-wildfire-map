
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Area Map</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #17212b;
      color: white;
    }

    h2 {
      padding: 12px 20px;
      margin: 0;
    }

    #status {
      padding: 0 20px 10px;
      font-size: 13px;
      color: #cccccc;
    }

    #map {
      height: calc(100vh - 85px);
      width: 100%;
    }

    .leaflet-overlay-pane path.pulse-boundary {
      animation: firePulse 2s ease-in-out infinite;
    }

    @keyframes firePulse {
      0%, 100% {
        stroke-opacity: 0.45;
        stroke-width: 2.5;
        filter: drop-shadow(0 0 1px #990000);
      }

      50% {
        stroke-opacity: 0.8;
        stroke-width: 4;
        filter: drop-shadow(0 0 4px #990000);
      }
    }
  </style>
</head>

<body>

  <h2>Active Wildfire Areas</h2>
  <div id="status">Loading wildfire perimeter data...</div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Create the map
    const map = L.map("map").setView([39, -98], 4);

    // Esri topographic basemap
    L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
      {
        attribution: "Tiles &copy; Esri and its contributors"
      }
    ).addTo(map);

    // Create the wildfire polygon layer
    const wildfireLayer = L.geoJSON(null, {

      style: {
        color: "#990000",
        weight: 3,
        opacity: 0.65,
        fillColor: "#990000",
        fillOpacity: 0.15,
        className: "pulse-boundary"
      },

      onEachFeature: function(feature, layer) {
        const p = feature.properties || {};

        const name =
          p.poly_IncidentName ||
          p.attr_IncidentName ||
          "Wildfire perimeter";

        const acres =
          p.poly_GISAcres ||
          p.attr_IncidentSize;

        const acreageText = acres
          ? Math.round(acres).toLocaleString() + " acres"
          : "Acreage not listed";

        layer.bindPopup(
          "<strong>" + name + "</strong><br>" + acreageText
        );
      }

    }).addTo(map);

    // NIFC current wildfire perimeter service
    const wildfireUrl =
      "https://services3.arcgis.com/T4QMspbfLg3qTGWY/ArcGIS/rest/services/WFIGS_Interagency_Perimeters_Current/FeatureServer/0/query?where=attr_IncidentTypeCategory%3D%27WF%27&outFields=*&returnGeometry=true&outSR=4326&f=geojson";

    // Retrieve actual wildfire boundaries
    fetch(wildfireUrl)

      .then(response => {
        if (!response.ok) {
          throw new Error("Unable to retrieve wildfire data");
        }

        return response.json();
      })

      .then(data => {
        if (data.error) {
          throw new Error(data.error.message);
        }

        wildfireLayer.addData(data);

        document.getElementById("status").textContent =
          data.features.length +
          " wildfire perimeter records loaded. Data source: NIFC.";

        console.log(
          "Wildfire perimeters loaded:",
          data.features.length
        );
      })

      .catch(error => {
        document.getElementById("status").textContent =
          "Wildfire data could not be loaded. Please try refreshing.";

        console.error("Wildfire data error:", error);
      });

  </script>

</body>
</html>
