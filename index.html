
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fire Incident Operations Map</title>

<link rel="stylesheet"
href="https://js.arcgis.com/4.32/esri/themes/dark/main.css">

<script src="https://js.arcgis.com/4.32/"></script>

<style>
html, body, #viewDiv {
  padding: 0;
  margin: 0;
  height: 100%;
  width: 100%;
  overflow: hidden;
  background: #171717;
}

#status {
  position: absolute;
  z-index: 10;
  top: 12px;
  left: 12px;
  background: #222;
  color: white;
  padding: 10px 14px;
  border-radius: 6px;
  font: 14px Arial, sans-serif;
}

.pulse-marker {
  position: absolute;
  width: 14px;
  height: 14px;
  background: #990000;
  border: 2px solid white;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  box-shadow: 0 0 5px #990000;
}

.pulse-marker::before {
  content: "";
  position: absolute;
  inset: -5px;
  border: 3px solid #990000;
  border-radius: 50%;
  animation: firePulse 1.8s ease-out infinite;
}

@keyframes firePulse {
  0% {
    transform: scale(0.7);
    opacity: 1;
  }
  100% {
    transform: scale(4);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div id="status">Fire Incident Operations Map</div>
<div id="viewDiv"></div>

<script>
require([
  "esri/Map",
  "esri/views/MapView",
  "esri/layers/FeatureLayer"
], function(Map, MapView, FeatureLayer) {

  // INSERT YOUR FIRE INCIDENT FEATURE SERVICE URL HERE
  const incidentURL = "PASTE_FIREMAP_INCIDENT_SERVICE_URL_HERE";

  const map = new Map({
    basemap: "dark-gray-vector"
  });

  const view = new MapView({
    container: "viewDiv",
    map: map,
    center: [-117.16, 32.72],
    zoom: 8
  });

  const status = document.getElementById("status");
  const markers = [];

  if (incidentURL.startsWith("https://")) {

    const incidents = new FeatureLayer({
      url: incidentURL,
      outFields: ["*"]
    });

    map.add(incidents);

    async function updateIncidents() {
      try {
        await incidents.load();

        const results = await incidents.queryFeatures({
          where: "1=1",
          outFields: ["*"],
          returnGeometry: true
        });

        markers.forEach(marker => marker.remove());
        markers.length = 0;

        results.features.forEach(feature => {
          if (!feature.geometry) return;

          const point = feature.geometry;
          const marker = document.createElement("div");
          marker.className = "pulse-marker";
          document.body.appendChild(marker);

          marker.featurePoint = point;
          markers.push(marker);
        });

        positionMarkers();

        status.textContent =
          "Active incidents displayed: " + markers.length;

      } catch (error) {
        status.textContent = "Unable to load incident data";
        console.error(error);
      }
    }

    function positionMarkers() {
      markers.forEach(marker => {
        const screenPoint = view.toScreen(marker.featurePoint);

        if (!screenPoint || !view.extent) return;

        marker.style.left = screenPoint.x + "px";
        marker.style.top = screenPoint.y + "px";

        marker.style.display =
          view.extent.contains(marker.featurePoint)
          ? "block" : "none";
      });
    }

    view.when(async () => {
      await updateIncidents();

      view.watch("stationary", stationary => {
        if (stationary) positionMarkers();
      });

      setInterval(updateIncidents, 60000);
    });

  } else {
    status.textContent =
      "Waiting for Firemap Incidents service URL";
  }

});
</script>

</body>
</html>
